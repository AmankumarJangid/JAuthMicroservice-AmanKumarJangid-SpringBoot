# Development pphase configuation

server:
  port: 8082

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: amanadmin


#    hikari: // very important if we want to use HikariCP connection pool, otherwise it will use default connection pool which is not recommended for production
#      pool-name : HikariCP
